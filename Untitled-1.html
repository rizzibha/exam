<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #error-msg {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
        .summary-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            display: none;
        }
        .summary-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bill Splitter</h2>
    
    <div id="error-msg"></div>

    <div class="form-group">
        <label for="bill">Bill amount (Rs)</label>
        <input type="number" id="bill" step="any" placeholder="Enter bill amount">
    </div>

    <div class="form-group">
        <label for="tip">Tip</label>
        <select id="tip">
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
        </select>
    </div>

    <div class="form-group">
        <label for="people">Number of people</label>
        <input type="number" id="people" value="1" min="1">
    </div>

    <button id="calculate-btn">Calculate</button>

    <div class="summary-box" id="summary">
        <p><strong>Total Tip:</strong> Rs <span id="tip-amount">0.00</span></p>
        <p><strong>Total Bill:</strong> Rs <span id="total-amount">0.00</span></p>
        <p><strong>Amount Per Person:</strong> Rs <span id="per-person">0.00</span></p>
    </div>
</div>

<script>
    document.getElementById('calculate-btn').addEventListener('click', function() {
        const errorDiv = document.getElementById('error-msg');
        const summaryDiv = document.getElementById('summary');
        
        // Reset view
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        // Read and convert values using parseFloat() and parseInt()
        const billInput = document.getElementById('bill').value;
        const tipInput = document.getElementById('tip').value;
        const peopleInput = document.getElementById('people').value;

        const bill = parseFloat(billInput);
        const tipPercent = parseFloat(tipInput);
        const people = parseInt(peopleInput, 10);

        // Validate inputs
        if (isNaN(bill) || bill <= 0) {
            errorDiv.textContent = 'Please enter a valid bill amount greater than 0.';
            errorDiv.style.display = 'block';
            summaryDiv.style.display = 'none';
            return;
        }

        if (isNaN(people) || people < 1) {
            errorDiv.textContent = 'Number of people must be at least 1.';
            errorDiv.style.display = 'block';
            summaryDiv.style.display = 'none';
            return;
        }

        // Calculations
        const tipAmount = (bill * tipPercent) / 100;
        const totalBill = bill + tipAmount;
        const perPerson = totalBill / people;

        // Display results in the summary box
        document.getElementById('tip-amount').textContent = tipAmount.toFixed(2);
        document.getElementById('total-amount').textContent = totalBill.toFixed(2);
        document.getElementById('per-person').textContent = perPerson.toFixed(2);
        
        summaryDiv.style.display = 'block';
    });
</script>

</body>
</html>
