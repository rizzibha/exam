<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .success-message {
            color: green;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Create Account</h2>
        <form id="registrationForm" novalidate>
            
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <span class="error-message" id="nameError">Name must have at least 3 characters.</span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@domain.com">
                <span class="error-message" id="emailError">Please enter a valid email following pattern name@domain.com.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 chars with 1 digit">
                <span class="error-message" id="passwordError">Password must have at least 6 characters and contain at least 1 digit.</span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                <span class="error-message" id="confirmError">Passwords do not match.</span>
            </div>

            <button type="submit">Register</button>
            <div class="success-message" id="successMessage">Registration successful! Welcome</div>
        </form>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(event) {
            // Prevent page reload on submit
            event.preventDefault();

            let isValid = true;

            // Hide success message initially on re-submits
            successMessage.style.display = 'none';

            // 1. Validate Full Name (At least 3 characters)
            if (fullNameInput.value.trim().length < 3) {
                nameError.style.display = 'block';
                isValid = false;
            } else {
                nameError.style.display = 'none';
            }

            // 2. Validate Email Pattern (name@domain.com)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(emailInput.value.trim())) {
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailError.style.display = 'none';
            }

            // 3. Validate Password (At least 6 characters, at least 1 digit)
            const passwordValue = passwordInput.value;
            const hasDigit = /\d/.test(passwordValue);
            if (passwordValue.length < 6 || !hasDigit) {
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
            }

            // 4. Validate Confirm Password (Must match password)
            if (confirmPasswordInput.value !== passwordValue || confirmPasswordInput.value === '') {
                confirmError.style.display = 'block';
                isValid = false;
            } else {
                confirmError.style.display = 'none';
            }

            // If all checks pass, show success message
            if (isValid) {
                successMessage.style.display = 'block';
                // Optional: reset form if needed
                // form.reset();
            }
        });
    </script>
</body>
</html>
